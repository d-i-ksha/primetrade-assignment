<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primetrade Assignment Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="container mx-auto p-6 max-w-4xl">
        <header class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-2xl font-bold text-teal-400">Primetrade.ai System Interface</h1>
            <button id="logoutBtn" onclick="logout()" class="hidden bg-red-600 hover:bg-red-700 px-4 py-2 rounded font-medium">Logout</button>
        </header>

        <!-- Dynamic Alert System Box -->
        <div id="alertBox" class="hidden p-4 mb-4 rounded font-semibold text-center"></div>

        <!-- AUTH VIEW SECTION -->
        <div id="authView" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Register Module -->
            <div class="bg-gray-800 p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-4 text-gray-200">Create Account</h2>
                <form id="registerForm" onsubmit="handleAuth(event, 'register')">
                    <input type="email" placeholder="Email" required class="w-full p-2 mb-3 bg-gray-700 border border-gray-600 rounded text-white" id="regEmail">
                    <input type="password" placeholder="Password" required class="w-full p-2 mb-3 bg-gray-700 border border-gray-600 rounded text-white" id="regPassword">
                    <select id="regRole" class="w-full p-2 mb-4 bg-gray-700 border border-gray-600 rounded text-white">
                        <option value="user">Regular User</option>
                        <option value="admin">System Admin</option>
                    </select>
                    <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 p-2 rounded font-bold">Register</button>
                </form>
            </div>
            <!-- Login Module -->
            <div class="bg-gray-800 p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-4 text-gray-200">Sign In</h2>
                <form id="loginForm" onsubmit="handleAuth(event, 'login')">
                    <input type="email" placeholder="Email" required class="w-full p-2 mb-3 bg-gray-700 border border-gray-600 rounded text-white" id="loginEmail">
                    <input type="password" placeholder="Password" required class="w-full p-2 mb-4 bg-gray-700 border border-gray-600 rounded text-white" id="loginPassword">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 p-2 rounded font-bold">Login</button>
                </form>
            </div>
        </div>

        <!-- PROTECTED SYSTEM DASHBOARD -->
        <div id="dashboardView" class="hidden space-y-6">
            <div class="bg-gray-800 p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-4 text-teal-400">Add New Resource / Task</h2>
                <form id="taskForm" onsubmit="createTask(event)" class="flex flex-col md:flex-row gap-4">
                    <input type="text" placeholder="Task Title" id="taskTitle" required class="flex-1 p-2 bg-gray-700 border border-gray-600 rounded text-white">
                    <input type="text" placeholder="Task Description" id="taskDesc" class="flex-1 p-2 bg-gray-700 border border-gray-600 rounded text-white">
                    <button type="submit" class="bg-teal-600 hover:bg-teal-700 px-6 py-2 rounded font-bold">Submit</button>
                </form>
            </div>

            <div class="bg-gray-800 p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-4 text-gray-200">Active Task Matrix</h2>
                <div id="taskList" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "/api/v1";
        let token = localStorage.getItem("token");

        function showAlert(msg, isSuccess = true) {
            const box = document.getElementById("alertBox");
            box.innerText = msg;
            box.className = `p-4 mb-4 rounded font-semibold text-center ${isSuccess ? 'bg-green-800 text-green-200' : 'bg-red-800 text-red-200'}`;
            setTimeout(() => box.classList.add("hidden"), 4000);
        }

        function checkAuth() {
            if (token) {
                document.getElementById("authView").classList.add("hidden");
                document.getElementById("dashboardView").classList.remove("hidden");
                document.getElementById("logoutBtn").classList.remove("hidden");
                fetchTasks();
            } else {
                document.getElementById("authView").classList.remove("hidden");
                document.getElementById("dashboardView").classList.add("hidden");
                document.getElementById("logoutBtn").classList.add("hidden");
            }
        }

        async function handleAuth(e, type) {
            e.preventDefault();
            const email = document.getElementById(type === 'register' ? 'regEmail' : 'loginEmail').value;
            const password = document.getElementById(type === 'register' ? 'regPassword' : 'loginPassword').value;
            const body = { email, password };
            if (type === 'register') body.role = document.getElementById('regRole').value;

            try {
                const response = await fetch(`${API_URL}/auth/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.detail || "Authentication Transaction Failed");

                if (type === 'login') {
                    token = data.access_token;
                    localStorage.setItem("token", token);
                    showAlert("Authentication Success. Welcome to Session.");
                    checkAuth();
                } else {
                    showAlert("Profile provisioned successfully. Proceed with login.");
                }
            } catch (err) {
                showAlert(err.message, false);
            }
        }

        async function fetchTasks() {
            try {
                const response = await fetch(`${API_URL}/tasks`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.status === 401) return logout();
                const tasks = await response.json();
                const container = document.getElementById("taskList");
                container.innerHTML = tasks.length === 0 ? '<p class="text-gray-400 text-center">No structural entries present in current view matrix.</p>' : '';
                
                tasks.forEach(task => {
                    container.innerHTML += `
                        <div class="bg-gray-700 p-4 rounded flex justify-between items-center border border-gray-600">
                            <div>
                                <h3 class="font-bold text-teal-300">${task.title}</h3>
                                <p class="text-sm text-gray-300">${task.description || ''}</p>
                                <span class="text-xs bg-gray-800 px-2 py-0.5 rounded text-gray-400">UID Owner: ${task.user_id}</span>
                            </div>
                            <button onclick="deleteTask(${task.id})" class="text-red-400 hover:text-red-600 text-sm font-semibold">Delete</button>
                        </div>`;
                });
            } catch (err) {
                showAlert("Error fetching structural task array.", false);
            }
        }

        async function createTask(e) {
            e.preventDefault();
            const title = document.getElementById("taskTitle").value;
            const description = document.getElementById("taskDesc").value;

            try {
                const response = await fetch(`${API_URL}/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ title, description })
                });
                if (response.ok) {
                    showAlert("Data entry written successfully.");
                    document.getElementById("taskForm").reset();
                    fetchTasks();
                } else {
                    const data = await response.json();
                    throw new Error(data.detail);
                }
            } catch (err) { showAlert(err.message, false); }
        }

        async function deleteTask(id) {
            try {
                const response = await fetch(`${API_URL}/tasks/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    showAlert("Record purged from database.");
                    fetchTasks();
                } else {
                    const data = await response.json();
                    throw new Error(data.detail);
                }
            } catch (err) { showAlert(err.message, false); }
        }

        function logout() {
            localStorage.removeItem("token");
            token = null;
            checkAuth();
        }

        // Initialize state on render
        checkAuth();
    </script>
</body>
</html>
